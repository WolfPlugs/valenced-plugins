name: Release plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-pool
  cancel-in-progress: false

permissions:
  contents: write

env:
  POOL_BRANCH: ${{ vars.POOL_BRANCH }}
  PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
  POOL_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
  PLAN: ${{ github.workspace }}/releases.json

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - run: bun install --frozen-lockfile

      - name: Check out the published pool
        run: .github/scripts/checkout-pool.sh

      - name: Plan releases
        id: plan
        run: .github/scripts/plan-releases.sh

      - name: Set up Android SDK
        if: steps.plan.outputs.count != '0'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;37.0.0'

      - name: Build plugins
        if: steps.plan.outputs.count != '0'
        run: bun run package
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}

      - name: Publish to the pool
        if: steps.plan.outputs.count != '0'
        run: .github/scripts/publish-pool.sh

      - name: Refresh repository metadata
        run: .github/scripts/regenerate-index.sh

      - name: Tag and write changelogs
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/tag-releases.sh

  deploy:
    needs: release
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
