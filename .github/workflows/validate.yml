name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;37.0.0'

      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run lint:types
      - run: bunx biome check plugins tools tests
      - run: shellcheck --shell=bash .github/scripts/*.sh
      - run: bun run package
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}
      - run: bun run generate-index --dist build/dist --base-url https://plugins.obamabot.me/valenced-plugins --out /tmp/index.json
