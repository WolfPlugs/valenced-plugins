name: Publish repository index

on:
  workflow_dispatch:

concurrency:
  group: publish-pool
  cancel-in-progress: false

permissions:
  contents: write

env:
  POOL_BRANCH: ${{ vars.POOL_BRANCH }}
  PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
  POOL_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Check out the published pool
        env:
          REQUIRE_POOL: 1
        run: .github/scripts/checkout-pool.sh

      - name: Regenerate and publish index.json
        run: .github/scripts/regenerate-index.sh

  deploy:
    needs: publish
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
